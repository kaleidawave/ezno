[workspace]
members = [
	"parser",
	"parser/visitable-derive",
	"parser/generator",
	"checker",
	"checker/binary-serialize-derive"
	# "lsp/server",
]

[package]
name = "ezno"
description = "A fast and correct TypeScript type checker and compiler with additional experiments. For use as a library or through the CLI"
authors = ["Ben <kaleidawave@gmail.com>"]
version = "0.0.23"
edition = "2021"
license = "MIT"
homepage = "https://kaleidawave.github.io/posts/introducing-ezno/"
repository = "https://github.com/kaleidawave/ezno"
default-run = "ezno"
categories = ["compilers"]
keywords = [
	"javascript",
	"typescript",
	"type-checker"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ezno"
path = "src/lib.rs"

# cdylib is for WASM
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ezno"
path = "src/main.rs"
doc = false

[dependencies]
# ezno-web-framework = { path = "./plugins/web" }

base64 = "0.22"

# TODO requires https://github.com/kaleidawave/source-map/pull/7
codespan-reporting = "0.11"
enum-variants-strings = "0.3"

# For `StrComparison` for string comparison
pretty_assertions = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple-json-parser = "0.0"
js-sys = "0.3"
lahl = "0.0.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
glob = "0.3"

# For CLI input across multiple lines
multiline-term-input = "0.1"

# For watching files
notify = "8"
notify-debouncer-full = "0.5"

# For updating binary
release-downloader = { version = "0.0", default-features = false, features = ["self-update"] }

[dependencies.checker]
path = "./checker"
version = "0.0.18"
features = ["ezno-parser", "serde-serialize"]
package = "ezno-checker"

[dependencies.parser]
path = "./parser"
version = "0.1.7"
features = ["extras"]
package = "ezno-parser"

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tsify = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-derive = "0.3"

[dev-dependencies]
pretty_assertions = "1.3.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
default_trait_access = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
new_without_default = "allow"
result_unit_err = "allow"
implicit_hasher = "allow"

[package.metadata.commands]
check-ws = "cargo check --workspace"

parse-check = "cargo r -p ezno-parser --example parse --message-format short private/corpus/aaa.tsx --extras"
parse-check-js = "cargo r -p ezno-parser --example parse --message-format short private/corpus/aaa.js"
parse-ast = "cargo r -p ezno-parser --example parse --message-format short private/corpus/aaa.tsx --ast --extras"
parse-ast-js = "cargo r -p ezno-parser --example parse --message-format short private/corpus/aaa.js --ast"

parse-fails = "cargo r -p ezno-parser --example parse --message-format short private/corpus/fails.js"
parse-check-all = "cargo r -p ezno-parser --example parse private/corpus/all.tsx --extras"
parse-check-ft = "./target/debug/examples/parse private/corpus/aaa.tsx --extras"

# ft means 'from target' (existing build)
parse-print-ast-ft = "./target/debug/examples/parse.exe ./private/corpus/aaa.tsx"
parser-tests = "cargo test -p ezno-parser --no-fail-fast --tests"
parser-specification = "spectra-options test parser/specification/*.test.md 'cargo run -q -p ezno-parser --example parse -- --rpc --interactive'"
parser-specification-dry-run = "spectra test parser/specification/*.test.md 'cargo run -q -p ezno-parser --example parse -- --rpc --interactive' --dry-run"
parser-specification-ft = "spectra test parser/specification/*.test.md './target/debug/examples/parse --rpc --interactive'"

test262 = "cargo r --manifest-path test262/Cargo.toml -- --store-results"
test262-statistics = "sqlite-tool statistics test262/out/results.db results percentage --grouping parser_out"

# TODO templating here
investigate-test262 = "sqlite-tool sample test262/out/results.db results --where 'parser_out LIKE \\'Expected%\\'' --pick 5"

spectra-dev = "spectra-options test checker/specification/specification.md 'cargo r -p ezno-checker --example runner -q -- --interactive --rpc'"
private-check = "cargo r -p ezno-checker --example private_check"
private-ast = "cargo r -p ezno-parser --example private_ast"

# [profile.dev]
# debug = false
